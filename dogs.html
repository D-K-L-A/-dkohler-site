<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Dolly & Belle</title>

<style>
:root {
  --bg: #0d0d0d;
  --panel: #151515;
  --white: #ffffff;
  --gray: rgba(255,255,255,0.7);
  --line: rgba(255,255,255,0.12);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--white);
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

.page {
  max-width: 1400px;
  margin: 0 auto;
  padding: 60px 40px 100px;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 50px;
}

.back-link {
  color: var(--gray);
  text-decoration: none;
  font-size: 14px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.back-link:hover {
  color: var(--white);
}

h1 {
  font-size: clamp(52px, 7vw, 100px);
  line-height: 0.92;
  margin: 0 0 20px;
  letter-spacing: -0.05em;
}

.intro {
  max-width: 720px;
  font-size: 22px;
  line-height: 1.6;
  color: var(--gray);
  margin-bottom: 60px;
}

.dog-gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 24px;
}

.dog-gallery img {
  width: 100%;
  display: block;
  border-radius: 22px;
  border: 1px solid var(--line);
  transition: transform 0.35s ease;
}

.dog-gallery img:hover {
  transform: scale(1.02);
}

.footer-note {
  margin-top: 60px;
  color: rgba(255,255,255,0.45);
  font-size: 14px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

@media (max-width: 768px) {

  .page {
    padding: 40px 22px 80px;
  }

  .intro {
    font-size: 18px;
  }

}
</style>
</head>

<body>

<div class="page">

  <div class="topbar">
    <a href="index.html" class="back-link">← Back to Workspace</a>
  </div>

  <h1>Dolly & Belle</h1>

  <div class="intro">
    The true CEOs of the household. 
    Equal parts chaos, charm, attitude, and emotional support. 
    Probably more photogenic than everyone else on the website.
  </div>

  <div class="dog-gallery">

    <img src="IMG_2379.jpeg" alt="Dolly and Belle">
    <img src="IMG_2203.jpeg" alt="Dolly and Belle">
    <img src="IMG_2595.jpeg" alt="Dolly and Belle">
    <img src="IMG_4013.jpeg" alt="Dolly and Belle">
    <img src="IMG_1386.JPG" alt="Dolly and Belle">
    <img src="IMG_1458.jpg" alt="Dolly and Belle">
    <img src="IMG_7381.jpeg" alt="Dolly and Belle">
    <img src="IMG_7366.jpeg" alt="Dolly and Belle">
    <img src="puppy.JPEG" alt="Dolly and Belle">
    <img src="IMG_3611.jpeg" alt="Dolly and Belle">

  </div>

  <div class="footer-note">
    Unexpected navigation rewards matter.
  </div>

</div>

</body>
</html>
