<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Thank You | Dan Kohler</title>

<style>

:root {
  --bg: #0d0d0d;
  --white: #ffffff;
  --gray: rgba(255,255,255,0.72);
  --line: rgba(255,255,255,0.12);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--white);
  font-family: Arial, Helvetica, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px;
}

.container {
  width: 100%;
  max-width: 760px;
}

.card {
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--line);
  border-radius: 34px;
  padding: 56px;
}

.kicker {
  font-size: 13px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.5);
  font-weight: 800;
  margin-bottom: 18px;
}

h1 {
  margin: 0;
  font-size: clamp(54px, 8vw, 92px);
  line-height: 0.92;
  letter-spacing: -0.06em;
}

.copy {
  margin-top: 28px;
  color: var(--gray);
  font-size: 24px;
  line-height: 1.6;
  max-width: 620px;
}

.actions {
  margin-top: 42px;
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
}

.buttonPrimary,
.buttonSecondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 16px 24px;
  border-radius: 999px;
  text-decoration: none;
  font-weight: 900;
  font-size: 16px;
  transition: all 0.2s ease;
}

.buttonPrimary {
  background: white;
  color: black;
}

.buttonSecondary {
  background: rgba(255,255,255,0.08);
  border: 1px solid var(--line);
  color: white;
}

.buttonPrimary:hover,
.buttonSecondary:hover {
  transform: translateY(-1px);
}

.footer {
  margin-top: 48px;
  padding-top: 28px;
  border-top: 1px solid var(--line);
  color: rgba(255,255,255,0.48);
  font-size: 18px;
  line-height: 1.6;
}

@media (max-width: 800px) {

  body {
    padding: 24px;
  }

  .card {
    padding: 34px;
  }

  .copy {
    font-size: 21px;
  }

}

</style>
</head>

<body>

<div class="container">

  <div class="card">

    <div class="kicker">
      Message received
    </div>

    <h1>
      Great.<br>
      I’ll take a look.
    </h1>

    <div class="copy">
      Thanks for reaching out. The best projects usually start with an interesting problem, an unfinished idea, or a conversation that wasn’t supposed to happen.
    </div>

    <div class="actions">

      <a class="buttonPrimary" href="index.html">
        Back to workspace
      </a>

      <a class="buttonSecondary" href="https://www.linkedin.com/in/kohlerdan/" target="_blank">
        LinkedIn
      </a>

    </div>

    <div class="footer">
      Dan Kohler<br>
      Strategy • Creative Systems • AI Transformation
    </div>

  </div>

</div>

</body>
</html>
